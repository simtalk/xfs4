<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书用户数据查询</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        
        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
        }
        
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #ff6b6b, #ff8e53);
            border-radius: 2px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,107,107,0.5);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .status.warning {
            background: #fff3e0;
            color: #e65100;
        }
        
        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .status.success .status-icon {
            background: #4caf50;
            color: #fff;
        }
        
        .status.error .status-icon {
            background: #f44336;
            color: #fff;
        }
        
        .status.warning .status-icon {
            background: #ff9800;
            color: #fff;
        }
        
        .search-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .search-tab {
            padding: 12px 25px;
            border: 2px solid #eee;
            border-radius: 50px;
            background: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-tab:hover {
            border-color: #ff8e53;
            color: #ff8e53;
        }
        
        .search-tab.active {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border-color: transparent;
            color: #fff;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 0 4px rgba(255,107,107,0.1);
        }
        
        .user-card {
            background: linear-gradient(135deg, #fff5f5, #fff);
            border-radius: 16px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid #ffe0e0;
        }
        
        .user-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            object-fit: cover;
        }
        
        .user-avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-nickname {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }
        
        .user-id {
            font-size: 0.9rem;
            color: #999;
            font-family: 'Monaco', 'Consolas', monospace;
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff6b6b;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #999;
            margin-top: 5px;
        }
        
        .user-description {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            color: #666;
            line-height: 1.6;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ffe0e0;
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #999;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📕 小红书用户数据查询</h1>
            <p>快速查询小红书用户信息</p>
        </div>
        
        <div class="card">
            <div class="card-title">用户搜索</div>
            
            <div class="search-tabs">
                <button class="search-tab active" onclick="switchTab('username', event)">🔍 按用户名搜索</button>
                <button class="search-tab" onclick="switchTab('id', event)">🏷️ 按UID搜索</button>
            </div>
            
            <input type="text" class="search-input" id="searchInput" placeholder="请输入用户UID" />
            
            <div style="margin-top: 20px;">
                <button class="btn" onclick="searchUser()">🔎 搜索</button>
            </div>
            
            <div id="searchStatus"></div>
            <div id="userResult"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">正在查询用户信息...</div>
            </div>
        </div>
        
        <div class="footer">
            小红书用户数据查询工具
        </div>
    </div>
    
    <script>
        let currentTab = 'id';
        
        function switchTab(tab, event) {
            currentTab = tab;
            document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            const input = document.getElementById('searchInput');
            input.placeholder = tab === 'username' ? '请输入用户名' : '请输入用户UID';
        }
        
        async function searchUser() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showSearchStatus('error', '请输入搜索内容');
                return;
            }
            
            document.getElementById('userResult').innerHTML = '';
            document.getElementById('loading').style.display = 'block';
            
            try {
                const endpoint = currentTab === 'username' ? '/api/search/username' : '/api/search/id';
                const body = currentTab === 'username' 
                    ? { username: query } 
                    : { userId: query };
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const result = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (result.success) {
                    displayUser(result.data);
                    showSearchStatus('success', '查询成功');
                } else {
                    showSearchStatus('error', result.error || '查询失败');
                }
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                showSearchStatus('error', '请求失败: ' + e.message);
            }
        }
        
        function showSearchStatus(type, message) {
            const status = document.getElementById('searchStatus');
            const icons = { success: '✓', error: '✗', warning: '!' };
            status.innerHTML = '<div class="status ' + type + '"><span class="status-icon">' + icons[type] + '</span>' + message + '</div>';
        }
        
        function displayUser(user) {
            const container = document.getElementById('userResult');
            
            const avatarHtml = user.avatar 
                ? '<img src="' + escapeHtml(user.avatar) + '" class="user-avatar" alt="头像" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' 
                : '';
            const avatarPlaceholder = '<div class="user-avatar-placeholder">' + (user.nickname ? user.nickname[0] : '?') + '</div>';
            
            const formatNumber = (num) => {
                if (!num) return '0';
                num = parseInt(num);
                if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';
                if (num >= 10000) return (num / 10000).toFixed(1) + '万';
                return num.toString();
            };
            
            container.innerHTML = `
                <div class="user-card">
                    <div class="user-header">
                        ${avatarHtml}
                        ${avatarPlaceholder}
                        <div class="user-info">
                            <div class="user-nickname">${escapeHtml(user.nickname || '未知用户')}</div>
                            <div class="user-id">UID: ${escapeHtml(user.userId || user.nickname || 'N/A')}</div>
                        </div>
                    </div>
                    <div class="user-stats">
                        <div class="stat-item">
                            <div class="stat-value">${formatNumber(user.followers)}</div>
                            <div class="stat-label">粉丝</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${formatNumber(user.following)}</div>
                            <div class="stat-label">关注</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${formatNumber(user.liked)}</div>
                            <div class="stat-label">获赞</div>
                        </div>
                    </div>
                    ${user.description ? '<div class="user-description">' + escapeHtml(user.description) + '</div>' : ''}
                </div>
            `;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchUser();
            }
        });
    </script>
</body>
</html>
